[book]
title = "Best practices"
authors = ["Jin Hong Kuan"]
description = "Personally curated engineering practices and study guides: maintainability, performance."
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/jinhongkuan/best-practices"
edit-url-template = "https://github.com/jinhongkuan/best-practices/edit/main/{path}"
additional-css = ["theme/custom.css"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
limit-results = 20
