[book]
title = "Agentic Finance"
authors = ["Jin Hong Kuan"]
description = "An engineering study guide for software that moves money on someone's behalf: delegated authority, ledgers, LLMs in the money path, and how to prove the state machines underneath are correct."
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/jinhongkuan/agentic-finance"
edit-url-template = "https://github.com/jinhongkuan/agentic-finance/edit/main/{path}"
site-url = "/agentic-finance/"
additional-css = ["theme/custom.css"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
limit-results = 20
